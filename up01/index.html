<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My krpano page</title>
</head>
<body>

<div id="krpano"></div>

<script>
const params = new URLSearchParams(location.search);
const vod = params.get("vod");

if (vod && /^[A-Za-z0-9_-]+$/.test(vod)) {
    const url = "../test/" + encodeURIComponent(vod) + ".html";

    fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error("Content not found");
            }
            return response.text();
        })
        .then(html => {
            document.getElementById("krpano").innerHTML = html;
        })
        .catch(error => {
            document.getElementById("krpano").textContent = error.message;
        });
}
</script>

</body>
</html>
